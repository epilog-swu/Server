<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Health Chronicle</title>
    <style>
        @media screen {
            .icons, .images {
                display: flex;
                justify-content: space-evenly;
            }
        }

        /* PDF용 스타일 */
        @media print {
            .icons, .images {
                display: block;
                text-align: center;
            }
            .icons img, .images img {
                display: inline-block;
                margin: 0 5px;
            }
        }
        @font-face {
            font-family: 'DelaGothicOne';
            src: url('classpath:/fonts/DelaGothicOne-Regular.ttf') format('truetype');
        }
        @font-face {
            font-family: 'NanumGothic';
            src: url('classpath:/fonts/NanumGothic-Regular.ttf') format('truetype');
        }
        body {
            font-family: 'NanumGothic';
            font-size: 13px;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            width: 18cm;
            min-height: 29.7cm;
        }
        .header {
            background-color:
                    #0A1128;
            color: white;
            padding: 10px 30px;
        }
        h1 {
            font-family: 'DelaGothicOne';
            font-size: 40px;
        }
        .footer {
            font-family: 'NanumGothic';
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #FEFCFB;
            padding: 20px 40px;
        }
        .content {
            padding: 20px;
        }
        .content h1 {
            font-family: 'DelaGothicOne';
            font-size: 32px;
            margin-bottom: 20px;
        }
        .content h2 {
            font-family: 'DelaGothicOne';
            font-weight: bold;
            font-size: 26px;
            margin: 20px 0;
        }
        h3{
            font-family: 'NanumGothic';
            font-size: 18px;
        }
        .content .date {
            margin: 10px 0;
        }
        .icons, .images {
            margin: 0 auto;
            text-align: center;
        }
        .icons img, .images img {
            width: 50px;
            height: auto;
            margin: 0 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <table style="width: 100%;" >
            <tr>
                <td style="width: 8%;"><img src="logo.png" style="height: 40px;" alt="app logo" /></td>
                <td><h1>DIALOG</h1></td>
            </tr>
        </table>
    </div>
    <div class="content">
        <table style="width: 100%;">
            <tr>
                <td style="width: 40%;">
                    <h1>Check out Your Personal Health Chronicle</h1>
                </td>
                <td style="width: 60%;">
                    <p style="margin-right: 10%;">
                        나의 건강 일지 보고서를 PDF로 확인해보세요.<br/><br/>
                        이 보고서는 낙상 위치, 혈당 수치, 혈압, 심박수 등 사용자가 기록한 모든 정보를 확인할 수 있습니다.<br/><br/>
                        낙상 기록은 일지를 직접 입력하지 않아도 자동으로 작성됩니다.
                    </p>
                </td>
            </tr>
        </table>
        <div class="icons" style="width: 100%;" >
            <img src="header_pattern.png" style="width: 100%;" alt="Icon 1" />
        </div>
        <h2>2024.07.11</h2>
        <p class="date">2024.07.11 기록된 일지는 총 3개입니다.</p>
        <h3>아침식사 전</h3>
        <div class="images">
            <img src="icon1.png" alt="Image 1"/>
            <img src="icon2.png" alt="Image 2"/>
            <img src="icon3.png" alt="Image 3"/>
            <img src="icon4.png" alt="Image 4"/>
            <img src="icon5.png" alt="Image 5"/>
            <img src="icon6.png" alt="Image 6"/>
        </div>
    </div>
    <div class="footer">
        <p>Dialog 2024 | 보고서 생성일 2024.07.11</p>
    </div>
</div>
</body>
</html>

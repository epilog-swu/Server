spring:
  websocket:
    message-size: 1GB
    max-text-message-size: 1GB
    max-binary-message-size: 1GB

  datasource:
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: ${SPRING_DDL_AUTO}
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate.format_sql: true
      dialect: org.hibernate.dialect.MySQL8InnoDBDialect
      hibernate.default_batch_fetch_size: 1000

  logging:
    level:
      org.hibernate.SQL: debug

  servlet:
    multipart:
      max-file-size: 200MB

springdoc:
  packages-to-scan: com.epi.epilog
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8
  swagger-ui:
    path: /swagger-ui
    disable-swagger-default-url: true
    display-request-duration: true
    operations-sorter: alpha

jwt:
  expiration_time: 180000 #3분
  secret: ${JWT_SECRET_KEY}

sms:
  cool:
    api: ${COOL_SMS_KEY}
    secret: ${COOL_SMS_SECRET}
  map:
    api: ${GOOGLE_API_KEY}
  server:
    phone: ${SERVER_PHONE_NUMBER}

kakao:
  api:
    key: ${KAKAO_API_KEY}

bitly:
  api:
    token: ${BITLY_API_KEY}

firebase:
  json: ${FIREBASE_CONFIG}

fall:
  domain: ${AI_SERVER_DOMAIN}